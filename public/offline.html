<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>PeerCo Checklists — Offline</title>
<style>
  :root {
    --color-bg: #f8fafc;
    --color-surface: #ffffff;
    --color-border: #e2e8f0;
    --color-text: #0f172a;
    --color-muted: #64748b;
    --color-accent: #2563eb;
  }
  .dark {
    --color-bg: #0a0a0b;
    --color-surface: #18181b;
    --color-border: #27272a;
    --color-text: #fafafa;
    --color-muted: #a1a1aa;
    --color-accent: #3b82f6;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--color-bg);
    color: var(--color-text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    padding: 24px;
  }
  .card {
    max-width: 360px;
    width: 100%;
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: 24px;
    padding: 32px 24px;
    text-align: center;
  }
  .icon {
    width: 56px;
    height: 56px;
    margin: 0 auto 16px;
    border-radius: 9999px;
    background: var(--color-border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
  }
  h1 { font-size: 18px; margin: 0 0 8px; }
  p { font-size: 14px; color: var(--color-muted); margin: 0 0 20px; }
  button {
    min-height: 48px;
    width: 100%;
    border: none;
    border-radius: 16px;
    background: var(--color-accent);
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon" aria-hidden="true">&#128225;</div>
    <h1>No internet connection</h1>
    <p>PeerCo Checklists needs a connection to load. Check your Wi-Fi or mobile data and try again.</p>
    <button type="button" onclick="location.reload()">Retry</button>
  </div>
  <script>
    try {
      var stored = window.localStorage.getItem("peerco:ui-theme");
      var theme = stored === "light" || stored === "dark" || stored === "system" ? stored : "system";
      var isDark = theme === "dark" || (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.classList.toggle("dark", isDark);
    } catch (e) {}
  </script>
</body>
</html>
